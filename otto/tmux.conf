# Otto's session (run.sh). It hosts one Claude Code and nothing else, so tmux
# stays out of the way: no prefix key and no status bar, every key goes to claude.
# Close the terminal (or the app) to detach; Otto keeps running.
set -g prefix None
unbind C-b
set -g status off
# Claude Code tracks the mouse; with this on, tmux passes the wheel through to it
# instead of turning it into arrow keys.
set -g mouse on
# Esc is a key Claude Code uses; don't hold it back waiting for a sequence.
set -s escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g history-limit 50000
# Several viewers (terminals over ssh, the desktop): the one that last did something sets the size.
set -g window-size latest
set -g default-terminal tmux-256color
set -as terminal-features ',xterm-256color:RGB'
