<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Otto Memory</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1024 1024'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23febc6a'/%3E%3Cstop offset='1' stop-color='%23ff9534'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='512' cy='512' r='512' fill='url(%23g)'/%3E%3Crect x='328' y='383' width='102' height='195' rx='47' fill='%23202020'/%3E%3Crect x='594' y='383' width='102' height='195' rx='47' fill='%23202020'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Tokens from the Otto site (dark is the design; light is its inverse for daylight reading). */
:root{
  --bg:#0a0a0a;--card:#1a1a1a;--raise:#222;--raise-2:#2c2c2c;--hover:#363636;--line:#1e1e1e;--line-2:#2a2a2a;
  --fg:#fff;--fg-soft:#d5d9e2;--muted:#7d8187;--dim:#55585e;
  --otto-1:#febc6a;--otto-2:#ff9534;--otto-text:#f5a462;--otto-tint:#f08a3c24;--otto-ink:#202020;--blue:#0a84ff;--warn:#ff6961;--ok:#34c759;
  --k-user:#ff9534;--k-feedback:#0a84ff;--k-project:#34c759;--k-reference:#bf5af2;--k-fact:#ffd60a;--k-loop:#ff453a;--k-saved:#64d2ff;--k-write:#8e8e93;
  --cl-s:78%;--cl-l:66%;--nav-bg:#0a0a0ad9;
  --font-sans:"Inter",ui-sans-serif,system-ui,-apple-system,sans-serif;--font-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --radius-card:24px;--radius-panel:14px;--radius-sm:8px;--radius-pill:9999px;
  --dur:.15s;--ease:cubic-bezier(0,0,.2,1);
  color-scheme:dark}
:root[data-theme=light]{
  --bg:#f5f5f7;--card:#fff;--raise:#f0f0f2;--raise-2:#e8e8eb;--hover:#dcdce0;--line:#e4e4e7;--line-2:#d4d4d8;
  --fg:#0a0a0a;--fg-soft:#2b2e33;--muted:#62666d;--dim:#8c9097;
  --otto-text:#b45309;--otto-tint:#f08a3c26;--blue:#0066d6;--warn:#c4271b;--ok:#1f7a35;
  --k-user:#d9700a;--k-feedback:#0a6fd8;--k-project:#248a3d;--k-reference:#8e44c9;--k-fact:#a67c00;--k-loop:#d70015;--k-saved:#0a84a8;--k-write:#6e6e73;
  --cl-s:66%;--cl-l:42%;--nav-bg:#f5f5f7d9;
  color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/24px var(--font-sans);letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
::selection{color:#fff;background:#ff953459}
:focus-visible{outline:2px solid var(--otto-2);outline-offset:2px}
a{color:var(--otto-text);text-decoration:none}
code,pre{font-family:var(--font-mono)}
button{font:inherit;letter-spacing:inherit;color:var(--fg-soft);background:var(--raise-2);border:0;border-radius:var(--radius-pill);height:32px;padding:0 14px;font-size:13px;cursor:pointer;transition:background var(--dur) var(--ease),color var(--dur) var(--ease);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button:hover{background:var(--hover);color:var(--fg)}
button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
input,select{font:inherit;font-size:14px;letter-spacing:inherit;color:var(--fg);background:var(--raise);border:1px solid var(--line-2);border-radius:var(--radius-pill);height:36px;padding:0 14px;min-width:0;transition:border-color var(--dur) var(--ease)}
input:focus,select:focus{outline:none;border-color:var(--otto-2)}
select{padding-right:8px}
input[type=checkbox]{height:auto;accent-color:var(--otto-2)}
input[type=range]{height:auto;padding:0;border:0;background:none;accent-color:var(--otto-2)}

.nav{position:sticky;top:0;z-index:50;background:var(--nav-bg);-webkit-backdrop-filter:saturate(1.2) blur(12px);backdrop-filter:saturate(1.2) blur(12px);border-bottom:1px solid var(--line)}
.nav-in{max-width:1200px;margin:0 auto;padding:0 16px;height:60px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:500;letter-spacing:-.01em;color:var(--fg)}
.brand svg{width:20px;height:20px;flex:none}
.brand span{color:var(--muted);font-weight:400}
.seg{display:inline-flex;background:var(--raise);border-radius:var(--radius-pill);padding:3px;gap:2px}
.seg button{height:28px;background:none}
.seg button[aria-pressed=true]{background:var(--raise-2);color:var(--fg)}
.nav .seg{margin-left:auto}
.meta{color:var(--muted);font-size:13px}
main{max-width:1200px;margin:0 auto;padding:0 16px 80px}
#listview{max-width:880px;margin:0 auto}
h1{font-size:40px;line-height:44px;font-weight:500;letter-spacing:-.6px;margin:44px 0 6px}
.lead{color:var(--muted);font-size:16px;margin:0 0 28px}
.lead .meta{display:block}
section{background:var(--card);border-radius:var(--radius-card);padding:24px 28px;margin:16px 0}
section>h2,.ptitle{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0;margin:0 0 10px}
.summary{font-size:15px;line-height:24px;color:var(--fg-soft)}
.summary h2{font-size:20px;line-height:28px;font-weight:500;letter-spacing:-.24px;color:var(--fg);margin:22px 0 6px}
.summary h2:first-child{margin-top:0}
.controls{position:sticky;top:60px;z-index:5;background:var(--bg);padding:12px 0;display:grid;gap:8px}
.controls input{width:100%}
.row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:600px){.row{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:32px;line-height:38px;margin-top:28px}section{padding:20px;border-radius:20px}}
.count{color:var(--muted);font-size:13px}
details.mem{scroll-margin-top:190px;background:var(--card);border-radius:var(--radius-panel);margin:8px 0;overflow:hidden;transition:background var(--dur) var(--ease)}
details.mem>summary{list-style:none;cursor:pointer;padding:14px 18px}
details.mem>summary:hover{background:var(--raise)}
details.mem>summary::-webkit-details-marker{display:none}
details.mem[open]>summary{border-bottom:1px solid var(--line-2)}
.name{font-weight:500;color:var(--fg);overflow-wrap:anywhere}
.desc{color:var(--muted);font-size:14px;line-height:20px;margin-top:2px;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.b{font-size:12px;line-height:20px;border-radius:var(--radius-pill);padding:0 9px;background:var(--raise-2);color:var(--fg-soft);white-space:nowrap}
.b.accent{background:var(--otto-tint);color:var(--otto-text)}
.b.warn{background:#ff69611f;color:var(--warn)}
.b.ok{background:#34c7591f;color:var(--ok)}
.body{padding:8px 18px 16px;overflow-wrap:anywhere;color:var(--fg-soft);font-size:15px}
.md pre{background:var(--raise);padding:12px;border-radius:var(--radius-sm);overflow-x:auto;font-size:13px;line-height:20px}
.md code{background:var(--raise-2);padding:1px 5px;border-radius:5px;font-size:.86em}
.md pre code{background:none;padding:0}
.md blockquote{margin:8px 0;padding-left:12px;border-left:2px solid var(--line-2);color:var(--muted)}
.md table{border-collapse:collapse;display:block;overflow-x:auto;font-size:14px}
.md td,.md th{border:1px solid var(--line-2);padding:4px 8px;text-align:left}
.md ul,.md ol{padding-left:22px}
.md h1,.md h2,.md h3,.md h4{font-size:16px;font-weight:500;color:var(--fg);margin:14px 0 4px}
.md hr{border:0;border-top:1px solid var(--line-2)}
a.wl{border-bottom:1px dashed var(--otto-text)}
a.wl.dead{color:var(--muted);border-color:var(--muted);cursor:default}
.loop{display:flex;gap:12px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line-2);font-size:15px}
.loop:first-of-type{border-top:0}
.loop .when{flex:0 0 92px;font:13px var(--font-mono);color:var(--muted)}
.loop .when.over{color:var(--warn)}
.loop .when.soon{color:var(--otto-text)}
.loop a{color:var(--fg-soft)}
.loop a:hover{color:var(--fg)}
.extra{font-size:13px;color:var(--muted);margin-top:10px}
.flash{box-shadow:0 0 0 2px var(--otto-2)}
.empty{color:var(--muted);padding:24px 0;text-align:center;font-size:14px}

/* Graph */
#graphview{padding-top:16px}
.pwrap{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.pwrap{grid-template-columns:minmax(0,1fr)}}
#pcards{display:flex;flex-direction:column;gap:12px;min-width:0}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-panel);padding:16px 18px;display:flex;flex-direction:column;gap:10px;transition:border-color var(--dur) var(--ease)}
.pcard.on{border-color:var(--otto-2)}
.pcard h3{margin:0;font-size:20px;line-height:26px;font-weight:500}
.pfacts{display:flex;flex-wrap:wrap;gap:6px}
.ptl{font-size:12px;line-height:16px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pnotes{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:20px;color:var(--fg-soft)}
.pnotes time{color:var(--muted);font-family:var(--font-mono);font-size:12px;margin-right:8px}
.pmen{display:flex;flex-direction:column;gap:2px;font-size:14px;line-height:20px;min-width:0}
.pmen a{color:var(--fg-soft);overflow-wrap:anywhere}
.pmen a:hover{color:var(--otto-text)}
.pside{position:sticky;top:76px;display:flex;flex-direction:column;gap:8px;min-width:0}
#pstage{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-panel);overflow:hidden;min-height:420px}
.gbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.gbar .search{flex:1 1 280px;position:relative}
.gbar .search input{width:100%;padding-left:36px}
.gbar .search svg{position:absolute;left:13px;top:11px;width:14px;height:14px;color:var(--muted)}
.gbar select{max-width:190px}
.gbar label{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--fg-soft);white-space:nowrap;cursor:pointer}
.gbar output{font:12px var(--font-mono);color:var(--muted);min-width:2.6em}
.gbar input[type=range]{width:96px}
.gsub{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:space-between;margin:8px 2px 10px}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px}
@media (max-width:860px){.stage{grid-template-columns:minmax(0,1fr)}}
#gstage{position:relative;background:var(--card);border-radius:var(--radius-panel);overflow:hidden;min-height:420px}
#gstage .empty{padding:80px 24px}
.side{background:var(--card);border-radius:var(--radius-panel);padding:16px;overflow:auto;font-size:14px;line-height:20px}
.side .ptitle{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.side .ptitle button{height:24px;padding:0 10px;font-size:12px}
.side>div:not([hidden]):not(:last-child){margin-bottom:22px}
.chip{display:flex;align-items:center;gap:8px;width:100%;padding:5px 8px;margin:0 -8px;border-radius:var(--radius-sm);cursor:pointer;color:var(--fg-soft);background:none;height:auto;font-size:14px;line-height:20px;text-align:left;white-space:normal}
.chip:hover{background:var(--raise)}
.chip[aria-pressed=true]{background:var(--otto-tint);color:var(--fg)}
.chip i{flex:none;width:9px;height:9px;border-radius:50%}
.chip .l{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.chip .n{font:12px var(--font-mono);color:var(--muted)}
.selcard .name{font-size:16px}
.selcard .acts{display:flex;gap:6px;margin-top:10px}
.selcard .acts button:first-child{background:var(--fg);color:var(--bg)}
/* Search view: the query in the middle, the matches' names beside their dots. */
#sov{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#sov>*{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform}
#sov .qp{display:flex;align-items:center;gap:8px;height:36px;padding:0 16px;max-width:min(360px,60%);border-radius:var(--radius-pill);background:var(--raise-2);box-shadow:0 0 0 1px var(--otto-2),0 8px 28px #0005;color:var(--fg);font-size:15px;font-weight:500}
#sov .qp svg{flex:none;width:14px;height:14px;color:var(--otto-text)}
#sov .qp span{overflow:hidden;text-overflow:ellipsis}
#sov .ml{max-width:var(--lw,220px);overflow:hidden;text-overflow:ellipsis;font-size:12px;line-height:16px;color:var(--fg-soft);text-shadow:0 0 3px var(--card),0 0 3px var(--card),0 0 6px var(--card)}
#sov .ml.on{color:var(--otto-text);font-weight:500}
.float-tooltip-kap{z-index:2;background:var(--raise-2)!important;color:var(--fg)!important;border-radius:var(--radius-sm)!important;padding:8px 10px!important;font:13px/18px var(--font-sans)!important;max-width:320px;box-shadow:0 8px 24px #0006}
.tip b{display:block;font-weight:500}
.tip span{color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>

<script>
const D = JSON.parse(document.getElementById('data').textContent)
const $ = id => document.getElementById(id)
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
const byName = {}
D.items.forEach((it, i) => { it.n = i; (byName[it.name.toLowerCase()] ??= []).push(it) })

// [[name]] -> the memory of that name, preferring the linking memory's scope, then global.
function resolve(name, scope) {
  const c = byName[name.toLowerCase()] || []
  return c.find(x => x.scope === scope) || c.find(x => x.scope === 'global') || c[0]
}
function inline(s, scope) {
  const codes = []
  s = esc(s).replace(/\x60([^\x60]+)\x60/g, (_, c) => (codes.push(c), '\u0000' + (codes.length - 1) + '\u0000'))
  s = s.replace(/\[\[([^\]]+)\]\]/g, (_, n) => { const t = resolve(n.trim(), scope); return t ? '<a class="wl" href="#m' + t.n + '" data-n="' + t.n + '">' + n + '</a>' : '<a class="wl dead" title="no memory by that name">' + n + '</a>' })
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+|[^)\s]+\.md)\)/g, (_, t, u) => { const m = /([^/]+)\.md$/.exec(u); const r = m && !/^https?:/.test(u) && resolve(m[1], scope); return r ? '<a class="wl" href="#m' + r.n + '" data-n="' + r.n + '">' + t + '</a>' : /^https?:/.test(u) ? '<a href="' + u + '" target="_blank" rel="noopener">' + t + '</a>' : t })
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => '<code>' + codes[i] + '</code>')
}
function md(src, scope) {
  const L = String(src).replace(/\r/g, '').split('\n'), out = []
  for (let i = 0; i < L.length;) {
    const l = L[i]
    if (/^\s*\x60\x60\x60/.test(l)) { const b = []; i++; while (i < L.length && !/^\s*\x60\x60\x60/.test(L[i])) b.push(L[i++]); i++; out.push('<pre><code>' + esc(b.join('\n')) + '</code></pre>'); continue }
    let m
    if ((m = /^(#{1,6})\s+(.*)/.exec(l))) { const h = Math.min(m[1].length + 1, 4); out.push('<h' + h + '>' + inline(m[2], scope) + '</h' + h + '>'); i++; continue }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(l)) { out.push('<hr>'); i++; continue }
    if (/^\s*\|.*\|\s*$/.test(l)) {
      const rows = []; while (i < L.length && /^\s*\|.*\|\s*$/.test(L[i])) rows.push(L[i++])
      const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim())
      const sep = rows[1] && /^[\s|:-]+$/.test(rows[1])
      out.push('<table>' + rows.filter((_, k) => !(sep && k === 1)).map((r, k) => '<tr>' + cells(r).map(c => (k === 0 && sep ? '<th>' : '<td>') + inline(c, scope) + (k === 0 && sep ? '</th>' : '</td>')).join('') + '</tr>').join('') + '</table>'); continue
    }
    if (/^\s*>/.test(l)) { const b = []; while (i < L.length && /^\s*>/.test(L[i])) b.push(L[i++].replace(/^\s*>\s?/, '')); out.push('<blockquote>' + md(b.join('\n'), scope) + '</blockquote>'); continue }
    if ((m = /^\s*([-*+]|\d+[.)])\s+/.exec(l))) {

    ctx.lineWidth = 3 / scale; ctx.strokeStyle = css(C.bg, 0.9); ctx.strokeText(c.label, x, y)
    ctx.fillStyle = css(byCluster ? C.cl[o.c] : C.soft, dim ? 0.3 : 1); ctx.fillText(c.label, x, y)
  }
}

function size() { const el = $('gstage'); return [el.clientWidth, Math.max(420, Math.min(innerHeight - el.getBoundingClientRect().top - 24, 960))] }

async function drawGraph() {
  const [src, name] = LIBS[is3d ? '3d' : '2d'], el = $('gstage')
  try { await lib(src) } catch {
    el.innerHTML = '<div class="empty">The graph library loads from cdn.jsdelivr.net, which could not be reached. The list works offline; reconnect and reload for the graph.</div>'
    return
  }
  if (G) { try { G._destructor() } catch {} }
  el.innerHTML = ''
  palette()
  const [w, h] = size()
  aspect = Math.max(0.6, Math.min(2, w / h))
  NODES.forEach(n => { if (n.x === undefined) { const [ax, ay] = anchor(n); n.x = ax + (Math.random() - 0.5) * 40; n.y = ay + (Math.random() - 0.5) * 40; if (n.c < 0 && GR.clusters && GR.clusters.length) { const t = n.id * 2.4; n.x = Math.cos(t) * spread() * 1.25; n.y = Math.sin(t) * spread() * 1.25 } } })
  G = window[name]()(el).width(w).height(h).backgroundColor(css(C.bg))
    .nodeId('id').nodeVal(nodeVal).nodeRelSize(is3d ? 3 : 3.2)
    .nodeColor(nodeColour).nodeLabel(n => n.q ? '' : tip(n)).nodeVisibility(n => !n.q)
    .linkColor(linkColour).linkWidth(l => is3d ? (l.ex ? 0.4 : 0) : l.ex ? 0.7 : 0.4)
    .onNodeClick(n => n.q || select(n)).onBackgroundClick(() => select(null))
    .onNodeHover(n => { H = n && !n.q ? n : null; el.style.cursor = H ? 'pointer' : '' })
    .cooldownTicks(500).warmupTicks(is3d ? 80 : 160).d3AlphaDecay(0.02)
    .onEngineStop(() => { if (!G.__fit) { G.__fit = true; fit() } })
  if (is3d) G.nodeOpacity(0.95).linkOpacity(0.22).showNavInfo(false).linkVisibility(l => l.same || !!Q)   // depth already separates clusters; cross edges in 3D are only clutter
  else G.onRenderFramePost(drawOverlay).autoPauseRedraw(false)
  G.d3Force('charge').strength(-14).distanceMax(80)
  G.d3Force('center', null)
  G.d3Force('link').distance(l => l.same ? (l.ex ? 18 : 10 + 24 * (1 - l.s)) : 120).strength(l => l.same ? 0.5 / Math.max(1, Math.min(l.source.deg, l.target.deg)) : 0)
  G.d3Force('cluster', clusterForce)
  G.graphData(view())
  setTimeout(fit, 900); if (is3d) setTimeout(fit, 2500)
}
function fit(ms = 0) {
  if (!G) return
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) ms = 0
  // Search view: the layout was sized to the stage, so the frame is fixed: centred, one unit per pixel.
  if (Q && !is3d) { G.centerAt(0, 0, ms); return G.zoom(1, ms) }
  if (Q) return G.cameraPosition({ x: 0, y: 0, z: G.height() / 2 / Math.tan(G.camera().fov * Math.PI / 360) }, { x: 0, y: 0, z: 0 }, ms)
  if (!is3d) return G.zoomToFit(ms, 48)
  // 3D: frame the bounding box from the front, by the camera's own field of view.
  const b = G.getGraphBbox()
  if (!b) return
  const c = ['x', 'y', 'z'].map(k => (b[k][0] + b[k][1]) / 2), t = Math.tan(G.camera().fov * Math.PI / 360)
  const d = 1.1 * Math.max((b.y[1] - b.y[0]) / 2 / t, (b.x[1] - b.x[0]) / 2 / (t * G.camera().aspect)) + (b.z[1] - b.z[0]) / 2
  G.cameraPosition({ x: c[0], y: c[1], z: c[2] + d }, { x: c[0], y: c[1], z: c[2] }, ms)
}
const settle = () => G.warmupTicks(is3d ? 80 : 160).cooldownTicks(500)
function regraph() { if (G) { G.__fit = false; settle(); G.graphData(view()); setTimeout(fit, 900) } }
// Entering, changing or leaving a search: everything already has a place, so frame it now.
// Leaving one puts the full graph back exactly where it was: no ticks, so nothing re-settles.
function research() {
  if (!G) return
  G.__fit = true
  // The search view is pinned, but the engine must run for the glide; the full graph must not.
  G.warmupTicks(0).cooldownTicks(Q ? 500 : 0)
  G.graphData(view())
  // The data swaps on the library's next update: frame it, and allow ticks again (for drags), after that.
  setTimeout(() => fit(650), 50)
  if (!Q) setTimeout(() => G && !Q && G.cooldownTicks(500), 300)
}
function recolour() { if (G) G.nodeColor(n => nodeColour(n)).linkColor(l => linkColour(l)).nodeVal(G.nodeVal()) }
function restyle() { palette(); if (PG) PG.backgroundColor(css(C.bg)); if (!G) return; G.backgroundColor(css(C.bg)); recolour(); legend() }

// Selection: the node's card and neighbours in the side panel.
function select(n) {
  SEL = n && NODES[n.id]   // never a search-view copy, which goes when the search clears
  n = SEL
  const el = $('sel')
  el.hidden = !n
  if (n) {
    const it = n.it, c = CL[n.c]
    const nb = NB[n.id].slice(0, 8).map(([j, s, ex]) => '<button class="chip" data-n="' + j + '" type="button"><i style="background:' + css(baseColour(NODES[j])) + '"></i><span class="l">' + esc(D.items[j].name) + '</span><span class="n">' + (ex ? 'link' : s.toFixed(2)) + '</span></button>').join('')
    el.innerHTML = '<div class="ptitle">Selected<button type="button" id="seloff">clear</button></div><div class="selcard"><div class="name">' + esc(it.name) + '</div>' +
      (it.description ? '<div class="desc">' + esc(it.description) + '</div>' : '') +
      '<div class="tags"><span class="b accent">' + esc(it.kind) + '</span>' + (c ? '<span class="b">' + esc(c.label) + '</span>' : '') + (it.hits ? '<span class="b">' + it.hits + ' recalls</span>' : '') + (n.noise ? '<span class="b">between clusters</span>' : '') + '</div>' +
      '<div class="acts"><button type="button" id="selopen">Open in list</button></div></div>' + (nb ? '<div class="ptitle" style="margin-top:14px">Nearest</div>' + nb : '')
    $('seloff').onclick = () => select(null)
    $('selopen').onclick = () => { showTab('list'); jump(n.id) }
  }
  recolour()
}
function focusNode(n) {
  if (Q) n = SN.get(n.id)   // in the search view only the matches are on the stage
  if (!G || !n || n.x === undefined) return
  if (is3d) { const d = 120, r = 1 + d / Math.hypot(n.x, n.y, n.z || 1); G.cameraPosition({ x: n.x * r, y: n.y * r, z: (n.z || 0) * r }, n, 600) }
  else { G.centerAt(n.x, n.y, 500); G.zoom(Math.max(G.zoom(), 2.5), 500) }
}
$('side').addEventListener('click', e => {
  const b = e.target.closest('.chip[data-n]')
  if (b) { const n = NODES[+b.dataset.n]; select(n); focusNode(n) }
  if (e.target.closest('.chip-off')) { FOCUS = null; legend(); regraph() }
  const c = e.target.closest('.chip[data-c]')
  if (c) { FOCUS = FOCUS === +c.dataset.c ? null : +c.dataset.c; legend(); regraph() }
})

// Hovering a cluster in the legend lights that cluster and dims the rest. Tracked on the list as a
// whole, so moving from one chip to the next never passes through "nothing hovered" and flickers.
function hoverCluster(c) { if (c === HC) return; HC = c; if (is3d) recolour() }
$('cl').addEventListener('pointerover', e => { const b = e.target.closest('.chip[data-c]'); hoverCluster(b ? +b.dataset.c : null) })
$('cl').addEventListener('pointerleave', () => hoverCluster(null))

// The side panel's resting content: what the colours mean. Clusters filter on click.
function legend() {
  if (byCluster) {
    $('cl').innerHTML = '<div class="ptitle">Clusters' + (FOCUS !== null ? '<button type="button" class="chip-off">show all</button>' : '') + '</div>' +
      GR.clusters.slice().sort((a, b) => b.size - a.size).map(c => '<button class="chip" type="button" data-c="' + c.id + '" aria-pressed="' + (FOCUS === c.id) + '" title="' + esc(c.terms.join(', ')) + '"><i style="background:' + css(C.cl[c.id]) + '"></i><span class="l">' + esc(c.label) + '</span><span class="n">' + c.size + '</span></button>').join('')
  } else {
    $('cl').innerHTML = '<div class="ptitle">Types</div>' + KINDS.map(k => '<div class="chip"><i style="background:' + css(C.kind[k]) + '"></i><span class="l">' + esc(k) + '</span><span class="n">' + D.items.filter(i => i.kind === k).length + '</span></div>').join('')
  }
  $('cl').insertAdjacentHTML('beforeend', '<div class="legend" style="margin-top:14px"><span>solid: [[link]]</span><span>faint: similar meaning</span><span>size: recalls</span><span>faded: between clusters</span></div>')
}

// Search: by meaning when served (the server embeds the query with the same model), by keyword otherwise.
let searchSeq = 0
async function search() {
  const q = $('gq').value.trim(), seq = ++searchSeq, out = $('results')
  if (!q) { out.hidden = true; if (Q) { Q = null; research() } return }
  let hits = null, how = 'keyword'
  if (semantic) {
    try {
      const r = await fetch('search?q=' + encodeURIComponent(q))
      const j = await r.json()
      if (!r.ok || j.error) throw new Error(j.error || r.status)
      hits = j.results.filter(([, s]) => s > 0.15).slice(0, 15); how = 'meaning'
    } catch { semantic = false; $('gq').placeholder = 'Search by keyword' }
  }
  if (seq !== searchSeq) return
  if (!hits) {
    const w = q.toLowerCase().split(/\s+/)
    hits = D.items.map(it => [it.n, w.filter(x => (it.name + '\n' + it.description + '\n' + it.body).toLowerCase().includes(x)).length / w.length]).filter(([, s]) => s === 1).sort((a, b) => D.items[b[0]].hits - D.items[a[0]].hits).slice(0, 40)
  }
  const was = Q
  Q = hits.length ? new Map(hits) : null; QSEM = how === 'meaning'
  out.hidden = false
  out.innerHTML = '<div class="ptitle">' + (how === 'meaning' ? 'Closest in meaning' : 'Keyword matches') + '<span class="n">' + hits.length + '</span></div>' +
    (hits.length ? hits.map(([n, s]) => '<button class="chip" type="button" title="' + esc(D.scopes[D.items[n].scope]) + '" data-n="' + n + '"><i style="background:' + css(baseColour(NODES[n])) + '"></i><span class="l">' + esc(D.items[n].name) + '</span><span class="n">' + (how === 'meaning' ? s.toFixed(2) : '') + '</span></button>').join('') : '<div class="empty">Nothing matches.</div>') +
    (how === 'keyword' && !SERVED ? '<div class="extra">For search by meaning, open this page with <code>bun otto/memviewer.ts --open</code>.</div>' : '')
  if (Q || was) research()
}
let searchTimer
$('gq').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(search, semantic ? 350 : 120) })
$('gq').addEventListener('keydown', e => { if (e.key === 'Escape') { $('gq').value = ''; clearTimeout(searchTimer); search() } })

$('gthr').addEventListener('input', () => { $('gthrv').textContent = (+$('gthr').value).toFixed(2) })
;['gthr', 'gkind', 'gscope', 'glinks', 'gsim', 'gnoise'].forEach(id => $(id).addEventListener('change', regraph))
function colourBy(c) { byCluster = c; $('ccluster').setAttribute('aria-pressed', c); $('ckind').setAttribute('aria-pressed', !c); recolour(); legend() }
$('ccluster').onclick = () => colourBy(true)
$('ckind').onclick = () => colourBy(false)
$('g3d').onclick = () => { is3d = !is3d; $('g3d').setAttribute('aria-pressed', is3d); history.replaceState(null, '', is3d ? '#graph-3d' : '#graph'); drawGraph() }
addEventListener('resize', () => { if (G && !$('graphview').hidden) { const [w, h] = size(); G.width(w).height(h); if (Q) research() } })

// People: you, each person you told Otto about, and the memories that name them.
const PP = D.people || []
let PG = null
const psize = () => [$('pstage').clientWidth, Math.max(420, Math.min(innerHeight - 140, 760))]
function pcard(p, i) {
  const f = [p.relationship && '<span class="b accent">' + esc(p.relationship) + '</span>', p.city && '<span class="b">' + esc(p.city) + '</span>',
    p.timezone && '<span class="b">' + esc(p.timezone) + '</span>', p.org && '<span class="b">' + esc(p.org) + '</span>',
    (p.inbound || p.outbound) ? '<span class="b" title="messages in and out">' + p.inbound + ' in · ' + p.outbound + ' out</span>' : '',
    p.lastContact && '<span class="b">last contact ' + esc(p.lastContact.slice(0, 10)) + '</span>'].filter(Boolean)
  const notes = p.notes.length ? '<div class="ptl">What you said</div><ul class="pnotes">' + p.notes.slice().reverse().map(n => '<li><time>' + esc(n.at.slice(0, 10)) + '</time>' + esc(n.text) + '</li>').join('') + '</ul>' : ''
  const men = p.mentions.length
    ? '<div class="ptl">In memory · ' + p.mentions.length + '</div><div class="pmen">' + p.mentions.slice(0, 12).map(n => '<a href="#m' + n + '" data-n="' + n + '">' + esc(D.items[n].name) + '</a>').join('') + (p.mentions.length > 12 ? '<span class="meta">and ' + (p.mentions.length - 12) + ' more in the graph</span>' : '') + '</div>'
    : '<div class="meta">No memory names them yet.</div>'
  return '<section class="pcard" id="p' + i + '"><h3>' + esc(p.name) + '</h3>' + (f.length ? '<div class="pfacts">' + f.join('') + '</div>' : '') + notes + men + '</section>'
}
function openMem(n) { showTab('list'); jump(n) }
function flashPerson(i) { const c = $('p' + i); c.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); c.classList.add('on'); setTimeout(() => c.classList.remove('on'), 1400) }
$('pcount').textContent = PP.length + (PP.length === 1 ? ' person' : ' people')
$('pcards').innerHTML = PP.length ? PP.map(pcard).join('') : '<p class="meta">Nobody yet. Tell Otto who someone is and they appear here.</p>'
$('pcards').querySelectorAll('a[data-n]').forEach(a => a.onclick = e => { e.preventDefault(); openMem(+a.dataset.n) })
async function drawPeople() {
  if (!PP.length) { $('pstage').hidden = true; return }
  try { await lib(LIBS['2d'][0]) } catch { $('pnote').textContent = 'The graph library did not load (it comes from a CDN); the cards still work.'; return }
  const nodes = [{ id: 'you', t: 'you', label: 'You' }], links = [], seen = new Set()
  PP.forEach((p, i) => { nodes.push({ id: 'p' + i, t: 'p', i, label: p.name }); links.push({ source: 'you', target: 'p' + i }) })
  PP.forEach((p, i) => p.mentions.forEach(n => {
    if (!seen.has(n)) { seen.add(n); nodes.push({ id: 'm' + n, t: 'm', n, label: D.items[n].name, kind: D.items[n].kind }) }
    links.push({ source: 'p' + i, target: 'm' + n })
  }))
  const [w, h] = psize()
  PG = ForceGraph()($('pstage')).width(w).height(h).graphData({ nodes, links }).backgroundColor(css(C.bg))
    .nodeRelSize(4).nodeVal(d => d.t === 'you' ? 7 : d.t === 'p' ? 4 : 1)
    .nodeColor(d => d.t === 'm' ? css(C.kind[d.kind] || C.muted) : d.t === 'p' ? css(C.accent) : css(C.fg))
    .linkColor(l => css(C.muted, l.source.t === 'you' || l.source === 'you' ? .6 : .25))
    .nodeLabel(d => d.t === 'm' ? esc(d.label) + ' <span style="opacity:.6">· ' + esc(d.kind) + '</span>' : '')
    .nodeCanvasObjectMode(() => 'after')
    .nodeCanvasObject((d, ctx, s) => {
      if (d.t === 'm') return
      ctx.font = (d.t === 'you' ? 600 : 500) + ' ' + 13 / s + 'px Inter, ui-sans-serif, sans-serif'
      ctx.fillStyle = css(C.fg); ctx.textAlign = 'center'; ctx.textBaseline = 'top'
      ctx.fillText(d.label, d.x, d.y + (d.t === 'you' ? 13 : 10) / s)
    })
    .onNodeClick(d => { if (d.t === 'm') openMem(d.n); else if (d.t === 'p') flashPerson(d.i) })
    .cooldownTicks(120).onEngineStop(() => PG.zoomToFit(300, 48))
}
addEventListener('resize', () => { if (PG && !$('peopleview').hidden) { const [w, h] = psize(); PG.width(w).height(h) } })

function showTab(t) {
  const g = t === 'graph', p = t === 'people'
  $('listview').hidden = g || p; $('graphview').hidden = !g; $('peopleview').hidden = !p
  $('tlist').setAttribute('aria-pressed', !g && !p); $('tgraph').setAttribute('aria-pressed', g); $('tpeople').setAttribute('aria-pressed', p)
  if (g) { history.replaceState(null, '', is3d ? '#graph-3d' : '#graph'); if (!G) drawGraph(); else { const [w, h] = size(); G.width(w).height(h) } }
  else if (p) { history.replaceState(null, '', '#people'); if (!PG) drawPeople(); else { const [w, h] = psize(); PG.width(w).height(h).backgroundColor(css(C.bg)) } }
  else if (/^#(graph|people)/.test(location.hash)) history.replaceState(null, '', location.pathname)
}
$('tlist').onclick = () => showTab('list')
$('tgraph').onclick = () => showTab('graph')
$('tpeople').onclick = () => showTab('people')
palette()
legend()

if (/^#m\d+$/.test(location.hash)) jump(+location.hash.slice(2))
else if (/^#graph/.test(location.hash)) { is3d = location.hash === '#graph-3d'; $('g3d').setAttribute('aria-pressed', is3d); showTab('graph') }
else if (location.hash === '#people') showTab('people')
// ?q= opens the graph with that search, so a search can be bookmarked.
const q0 = new URLSearchParams(location.search).get('q')
if (q0) { if ($('graphview').hidden) showTab('graph'); $('gq').value = q0; search() }
</script>
</body>
